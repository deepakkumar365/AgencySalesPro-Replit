{% extends "base.html" %}

{% block title %}{{ 'Edit' if agency else 'Create' }} Agency - AgencySales Pro{% endblock %}

{% block content %}
<style>
/* Mobile-First Agency Form Styles */
.agency-form-card {
    background: white;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

.agency-form-header {
    background: var(--accent-light);
    color: var(--primary-dark);
    border-radius: 12px 12px 0 0;
    padding: 1rem 1.5rem;
    border-bottom: 1px solid var(--bs-border-color);
}

.agency-form-body {
    padding: 1.5rem;
}

.form-control, .form-select {
    padding: 0.75rem;
    border-radius: 8px;
    font-size: 1rem;
    min-height: 44px;
}

.form-label {
    font-weight: 600;
    color: var(--primary-dark);
    margin-bottom: 0.5rem;
}

.btn {
    min-height: 44px;
    padding: 0.75rem 1.5rem;
    border-radius: 8px;
    font-weight: 600;
}

.agency-section {
    background: var(--accent-light);
    border-radius: 8px;
    padding: 1rem;
    margin-bottom: 1.5rem;
}

.agency-section h6 {
    margin-bottom: 1rem;
    color: var(--primary-dark);
    font-weight: 600;
}

/* Mobile responsive adjustments */
@media (max-width: 767.98px) {
    .agency-form-header h4 {
        font-size: 1.3rem;
    }
    
    .agency-form-body {
        padding: 1rem;
    }
    
    .form-control, .form-select {
        font-size: 16px; /* Prevents zoom on iOS */
    }
    
    .btn-group {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        width: 100%;
    }
    
    .btn-group .btn {
        width: 100%;
    }
}

@media (min-width: 768px) {
    .agency-form-body {
        padding: 2rem;
    }
}
</style>

<div class="row justify-content-center">
    <div class="col-12 col-lg-8">
        <div class="agency-form-card">
            <div class="agency-form-header">
                <h4 class="mb-0">
                    <i class="fas fa-building me-2"></i>{{ 'Edit' if agency else 'Create' }} Agency
                </h4>
            </div>
            <div class="agency-form-body">
                <form method="POST">
                    <!-- Basic Information Section -->
                    <div class="agency-section">
                        <h6><i class="fas fa-info-circle me-2"></i>Basic Information</h6>
                        <div class="row">
                            <div class="col-md-8 mb-3">
                                <label for="name" class="form-label">Agency Name *</label>
                                <input type="text" class="form-control" id="name" name="name" 
                                       value="{{ agency.name if agency else '' }}" required
                                       placeholder="Enter agency name">
                            </div>
                            <div class="col-md-4 mb-3">
                                <label for="code" class="form-label">Agency Code *</label>
                                <input type="text" class="form-control" id="code" name="code" 
                                       value="{{ agency.code if agency else '' }}" required
                                       placeholder="e.g. AGENCY01">
                                <div class="form-text">Unique identifier for the agency</div>
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="address" class="form-label">Address</label>
                            <textarea class="form-control" id="address" name="address" rows="3"
                                      placeholder="Enter complete address">{{ agency.address if agency else '' }}</textarea>
                        </div>
                    </div>
                    
                    <!-- Contact Information Section -->
                    <div class="agency-section">
                        <h6><i class="fas fa-phone me-2"></i>Contact Information</h6>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="phone" class="form-label">Phone</label>
                                <input type="tel" class="form-control" id="phone" name="phone" 
                                       value="{{ agency.phone if agency else '' }}"
                                       placeholder="+1 (555) 123-4567">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" name="email" 
                                       value="{{ agency.email if agency else '' }}"
                                       placeholder="agency@example.com">
                            </div>
                        </div>
                    </div>
                    
                    <!-- Submit Buttons -->
                    <div class="btn-group d-grid gap-2 d-md-flex justify-content-md-end">
                        <a href="{{ url_for('agency.list_agencies') }}" class="btn btn-secondary">
                            <i class="fas fa-arrow-left me-2"></i>Cancel
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save me-2"></i>{{ 'Update' if agency else 'Create' }} Agency
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
