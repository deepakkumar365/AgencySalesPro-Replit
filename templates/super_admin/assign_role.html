{% extends 'base.html' %}
{% block title %}Assign Roles to {{ user.username }}{% endblock %}
{% block content %}
<h1>Assign Roles to {{ user.username }}</h1>
<form method="post">
  <div class="mb-3">
    <label class="form-label">Roles</label>
    <div>
      {% for r in roles %}
        <label class="form-check form-check-inline">
          <input class="form-check-input" type="checkbox" name="roles" value="{{ r.id }}" {% if r in user.roles %}checked{% endif %}> {{ r.name }}
        </label>
      {% endfor %}
    </div>
  </div>
  <button class="btn btn-primary">Save</button>
</form>
{% endblock %}
