{% extends 'base.html' %}
{% block title %}Edit Role{% endblock %}
{% block content %}
<h1>Edit Role: {{ role.name }}</h1>
<form method="post">
  <div class="mb-3">
    <label class="form-label">Description</label>
    <input class="form-control" name="description" value="{{ role.description }}" />
  </div>
  <div class="mb-3">
    <label class="form-label">Permissions</label>
    <div>
      {% for p in permissions %}
        <label class="form-check form-check-inline">
          <input class="form-check-input" type="checkbox" name="permissions" value="{{ p.code }}" {% if p in role.permissions %}checked{% endif %}> {{ p.code }}
        </label>
      {% endfor %}
    </div>
  </div>
  <button class="btn btn-primary">Save</button>
</form>
{% endblock %}
