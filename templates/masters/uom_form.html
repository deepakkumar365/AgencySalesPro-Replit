{% extends "base.html" %}

{% block title %}{{ 'Edit' if uom else 'Create' }} UOM - AgencySales Pro{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h4 class="mb-0">
                        <i class="fas fa-balance-scale me-2"></i>{{ 'Edit' if uom else 'Create' }} Unit of Measure
                    </h4>
                </div>
                <div class="card-body">
                    <form method="POST">
                        <div class="row">
                            <div class="col-md-8 mb-3">
                                <label for="name" class="form-label">UOM Name *</label>
                                <input type="text" class="form-control" id="name" name="name" 
                                       value="{{ uom.name if uom else '' }}" placeholder="e.g., Pieces, Kilograms" required>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label for="short_name" class="form-label">Short Name *</label>
                                <input type="text" class="form-control" id="short_name" name="short_name" 
                                       value="{{ uom.short_name if uom else '' }}" placeholder="e.g., Pcs, Kg" required>
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="description" class="form-label">Description</label>
                            <textarea class="form-control" id="description" name="description" rows="3">{{ uom.description if uom else '' }}</textarea>
                        </div>
                        
                        <div class="d-flex justify-content-between">
                            <a href="{{ url_for('masters.uoms') }}" class="btn btn-outline-secondary">
                                <i class="fas fa-times me-1"></i>Cancel
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save me-2"></i>{{ 'Update' if uom else 'Create' }} UOM
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
