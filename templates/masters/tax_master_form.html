{% extends "base.html" %}

{% block title %}{{ 'Edit' if tax_master else 'Create' }} Tax Master - AgencySales Pro{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h4 class="mb-0">
                        <i class="fas fa-percent me-2"></i>{{ 'Edit' if tax_master else 'Create' }} Tax Master
                    </h4>
                </div>
                <div class="card-body">
                    <form method="POST">
                        <div class="mb-3">
                            <label for="name" class="form-label">Tax Name *</label>
                            <input type="text" class="form-control" id="name" name="name" 
                                   value="{{ tax_master.name if tax_master else '' }}" placeholder="e.g., GST 18%, CGST 9%" required>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="tax_code" class="form-label">Tax Code *</label>
                                <input type="text" class="form-control" id="tax_code" name="tax_code" 
                                       value="{{ tax_master.tax_code if tax_master else '' }}" placeholder="e.g., GST18, CGST9" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="tax_rate" class="form-label">Tax Rate (%) *</label>
                                <input type="number" step="0.01" class="form-control" id="tax_rate" name="tax_rate" 
                                       value="{{ tax_master.tax_rate if tax_master else '' }}" placeholder="18.00" required>
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="description" class="form-label">Description</label>
                            <textarea class="form-control" id="description" name="description" rows="3">{{ tax_master.description if tax_master else '' }}</textarea>
                        </div>
                        
                        <div class="alert alert-info">
                            <small>
                                <i class="fas fa-info-circle me-1"></i>
                                <strong>Common Indian Tax Rates:</strong> 0%, 5%, 12%, 18%, 28% (GST rates)
                            </small>
                        </div>
                        
                        <div class="d-flex justify-content-between">
                            <a href="{{ url_for('masters.tax_masters') }}" class="btn btn-outline-secondary">
                                <i class="fas fa-times me-1"></i>Cancel
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save me-2"></i>{{ 'Update' if tax_master else 'Create' }} Tax Master
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
