{% extends "base.html" %}

{% block title %}{{ 'Edit' if category else 'Create' }} Category - AgencySales Pro{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h4 class="mb-0">
                        <i class="fas fa-tags me-2"></i>{{ 'Edit' if category else 'Create' }} Category
                    </h4>
                </div>
                <div class="card-body">
                    <form method="POST">
                        <div class="mb-3">
                            <label for="name" class="form-label">Category Name *</label>
                            <input type="text" class="form-control" id="name" name="name" 
                                   value="{{ category.name if category else '' }}" required>
                        </div>

                        <div class="mb-3">
                            <label for="short_name" class="form-label">Short Name (3 letters) *</label>
                            <input type="text" class="form-control" id="short_name" name="short_name"
                                   value="{{ category.short_name if category else '' }}" maxlength="3" minlength="3" required>
                            <small class="text-muted">Exactly 3 characters, e.g., "BVG".</small>
                        </div>
                        
                        <div class="mb-3">
                            <label for="description" class="form-label">Description</label>
                            <textarea class="form-control" id="description" name="description" rows="3">{{ category.description if category else '' }}</textarea>
                        </div>
                        
                        <div class="d-flex justify-content-between">
                            <a href="{{ url_for('masters.categories') }}" class="btn btn-outline-secondary">
                                <i class="fas fa-times me-1"></i>Cancel
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save me-2"></i>{{ 'Update' if category else 'Create' }} Category
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
