{% extends 'base.html' %}
{% block content %}
<div class="container" style="max-width: 820px;">
  <h4 class="mb-3">Edit Agency Override</h4>
  <form method="POST">
    <div class="card mb-3">
      <div class="card-body">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Global Name</label>
            <input type="text" class="form-control" value="{{ product.name }}" disabled />
          </div>
          <div class="col-md-6">
            <label class="form-label">SKU</label>
            <input type="text" class="form-control" value="{{ product.sku }}" disabled />
          </div>
          <div class="col-md-6">
            <label class="form-label">Display Name (Agency)</label>
            <input type="text" class="form-control" name="display_name" value="{{ mapping.display_name or '' }}" placeholder="Optional" />
          </div>
          <div class="col-md-6">
            <label class="form-label">Sell Price (Agency)</label>
            <input type="number" step="0.01" class="form-control" name="sell_price" value="{{ mapping.sell_price if mapping.sell_price is not none else '' }}" placeholder="Leave blank to use default" />
          </div>
          <div class="col-md-6">
            <label class="form-label">Category (Agency)</label>
            <select class="form-select" name="category_id">
              <option value="">Use default</option>
              {% for c in categories %}
              <option value="{{ c.id }}" {{ 'selected' if mapping.category_id and mapping.category_id == c.id else '' }}>{{ c.name }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label">UOM (Agency)</label>
            <select class="form-select" name="uom_id">
              <option value="">Use default</option>
              {% for u in uoms %}
              <option value="{{ u.id }}" {{ 'selected' if mapping.uom_id and mapping.uom_id == u.id else '' }}>{{ u.name }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label">Tax (Agency)</label>
            <select class="form-select" name="tax_master_id">
              <option value="">Use default</option>
              {% for t in tax_masters %}
              <option value="{{ t.id }}" {{ 'selected' if mapping.tax_master_id and mapping.tax_master_id == t.id else '' }}>{{ t.tax_code }} - {{ t.percentage }}%</option>
              {% endfor %}
            </select>
          </div>
          <div class="col-md-6 d-flex align-items-end">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" name="is_active" id="is_active" {{ 'checked' if mapping.is_active else '' }}>
              <label class="form-check-label" for="is_active">Active</label>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="d-flex gap-2 justify-content-end">
      <a class="btn btn-secondary" href="{{ url_for('product_overrides.list_overrides', agency=agency_id) }}">Cancel</a>
      <button type="submit" class="btn btn-primary">Save</button>
    </div>
  </form>
</div>
{% endblock %}
