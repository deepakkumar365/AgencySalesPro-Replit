<nav class="sidebar">
    <ul class="nav flex-column">
        {% for item in user_menu %}
            <li class="nav-item">
                <a href="{{ url_for(item.url) if item.url else '#' }}" class="nav-link">
                    {% if item.icon %}<i class="fas fa-{{ item.icon }} me-2"></i>{% endif %}
                    {{ item.name }}
                </a>

                {% if item.accessible_children %}
                <ul class="nav flex-column ms-3">
                    {% for child in item.accessible_children %}
                    <li class="nav-item">
                        <a href="{{ url_for(child.url) }}" class="nav-link">
                            {% if child.icon %}<i class="fas fa-{{ child.icon }} me-2"></i>{% endif %}
                            {{ child.name }}
                        </a>
                    </li>
                    {% endfor %}
                </ul>
                {% endif %}
            </li>
        {% endfor %}
    </ul>
</nav>
