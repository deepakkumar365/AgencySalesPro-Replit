{% extends "base.html" %}

{% block title %}Billing Dashboard - AgencySales Pro{% endblock %}

{% block content %}
<div class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="fas fa-file-invoice-dollar me-2"></i>Billing Dashboard</h2>
    </div>

    <!-- Period Filter -->
    <div class="card mb-4">
        <div class="card-body">
            <form method="GET" action="{{ url_for('billing.dashboard') }}" class="row g-3">
                <div class="col-md-3">
                    <label class="form-label">Period</label>
                    <select name="period" class="form-select" id="periodSelect" onchange="updateDateInput()">
                        <option value="daily" {% if period == 'daily' %}selected{% endif %}>Daily</option>
                        <option value="weekly" {% if period == 'weekly' %}selected{% endif %}>Weekly</option>
                        <option value="monthly" {% if period == 'monthly' %}selected{% endif %}>Monthly</option>
                        <option value="yearly" {% if period == 'yearly' %}selected{% endif %}>Yearly</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label" id="dateLabel">Select Date</label>
                    <input type="date" name="date" class="form-control" value="{{ selected_date }}" id="dateInput">
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="fas fa-filter me-1"></i>Apply Filter
                    </button>
                </div>
                <div class="col-md-4 d-flex align-items-end">
                    <div class="text-muted small">
                        <i class="fas fa-calendar me-1"></i>
                        Showing: {{ start_date.strftime('%d %b %Y') }} to {{ end_date.strftime('%d %b %Y
