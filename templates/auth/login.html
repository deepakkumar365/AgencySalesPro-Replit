{% extends "base.html" %}

{% block title %}Login - AgencySales Pro{% endblock %}

{% block content %}
<style>
/* Mobile-First Login Styles */
.login-container {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
    background: linear-gradient(135deg, var(--primary-dark) 0%, var(--accent-light) 100%);
}

.login-card {
    background: white;
    border-radius: 16px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.1);
    border: none;
    width: 100%;
    max-width: 400px;
    backdrop-filter: blur(10px);
}

.login-header {
    padding: 1rem;
    text-align: center;
    border-bottom: 1px solid var(--bs-border-color);
}

.login-header h4 {
    margin: 0;
    font-size: 1.25rem;
    font-weight: 600;
    color: var(--primary-dark);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
}

.login-body {
    padding: 2rem;
}

.form-control {
    padding: 0.875rem;
    border-radius: 10px;
    font-size: 1rem;
    min-height: 48px;
    border: 2px solid var(--bs-border-color);
    transition: all 0.3s ease;
}

.form-control:focus {
    border-color: var(--primary-dark);
    box-shadow: 0 0 0 0.2rem rgba(var(--primary-dark-rgb), 0.25);
}

.form-label {
    font-weight: 600;
    color: var(--primary-dark);
    margin-bottom: 0.5rem;
    font-size: 0.95rem;
}

.input-group-text {
    background: var(--accent-light);
    border: 2px solid var(--bs-border-color);
    border-right: none;
    border-radius: 10px 0 0 10px;
    color: var(--primary-dark);
    transition: all 0.3s ease;
}

.input-group .form-control {
    border-left: none;
    border-radius: 0 10px 10px 0;
}

.input-group:focus-within .input-group-text {
    border-color: var(--primary-dark);
    background: var(--primary-dark);
    color: white;
}

.btn-primary {
    background: linear-gradient(135deg, var(--primary-dark) 0%, var(--accent-light) 100%);
    border: none;
    padding: 0.875rem;
    border-radius: 10px;
    font-weight: 600;
    font-size: 1rem;
    min-height: 48px;
    transition: all 0.3s ease;
}

.btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 16px rgba(var(--primary-dark-rgb), 0.3);
}

.login-footer {
    background: var(--bs-gray-50);
    border-radius: 0 0 16px 16px;
    padding: 1rem 1.5rem;
    text-align: center;
    color: var(--bs-secondary);
    font-size: 0.85rem;
}

/* Mobile responsive adjustments */
@media (max-width: 767.98px) {
    .login-container {
        padding: 0.5rem;
        min-height: 100vh;
    }
    
    .login-body {
        padding: 1.5rem;
    }
    
    .form-control {
        font-size: 16px; /* Prevents zoom on iOS */
    }
    
    .login-header h4 {
        font-size: 1.1rem;
    }
}

@media (min-width: 768px) {
    .login-container {
        padding: 2rem;
    }
    
    .login-body {
        padding: 2.5rem;
    }
}

/* iOS specific fixes */
@supports (-webkit-appearance: none) {
    .form-control {
        font-size: 16px;
        -webkit-appearance: none;
    }
}
</style>

<div class="login-container">
    <div class="login-card">
        <div class="login-header">
            <h4 class="mb-0">
                <i class="fas fa-sign-in-alt"></i>Welcome Back
            </h4>
        </div>
        <div class="login-body">
            <form method="POST">
                <div class="mb-4">
                    <label for="username" class="form-label">Username</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="fas fa-user"></i>
                        </span>
                        <input type="text" class="form-control" id="username" name="username" required autofocus
                               placeholder="Enter your username">
                    </div>
                </div>
                
                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="fas fa-lock"></i>
                        </span>
                        <input type="password" class="form-control" id="password" name="password" required
                               placeholder="Enter your password">
                    </div>
                </div>
                
                <div class="d-grid">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-sign-in-alt me-2"></i>Sign In
                    </button>
                </div>
            </form>
        </div>
        <div class="login-footer">
            <i class="fas fa-shield-alt me-1"></i>
            Secure Login • AgencySales Pro © 2025
        </div>
    </div>
</div>
{% endblock %}
