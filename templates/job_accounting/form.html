{% extends "base.html" %}

{% block title %}{{ form_title }} - AgencySales Pro{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="card">
        <div class="card-header">
            <h3><i class="fas fa-briefcase me-2"></i>{{ form_title }}</h3>
        </div>
        <div class="card-body">
            <form method="POST">
                <div class="row">
                    <!-- Left Column -->
                    <div class="col-md-8">
                        <div class="mb-3">
                            <label for="name" class="form-label">Job Name <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="name" name="name" value="{{ job.name if job else '' }}" required>
                        </div>
                        <div class="mb-3">
                            <label for="description" class="form-label">Description</label>
                            <textarea class="form-control" id="description" name="description" rows="5">{{ job.description if job else '' }}</textarea>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="budget_amount" class="form-label">Budget Amount (₹)</label>
                                <input type="number" step="0.01" class="form-control" id="budget_amount" name="budget_amount" value="{{ job.budget_amount if job else '0.00' }}">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="estimated_cost" class="form-label">Estimated Cost (₹)</label>
                                <input type="number" step="0.01" class="form-control" id="estimated_cost" name="estimated_cost" value="{{ job.estimated_cost if job else '0.00' }}">
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="start_date" class="form-label">Start Date</label>
                                <input type="date" class="form-control" id="start_date" name="start_date" value="{{ job.start_date.strftime('%Y-%m-%d') if job and job.start_date else '' }}">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="end_date" class="form-label">End Date</label>
                                <input type="date" class="form-control" id="end_date" name="end_date" value="{{ job.end_date.strftime('%Y-%m-%d') if job and job.end_date else '' }}">
                            </div>
                        </div>
                    </div>

                    <!-- Right Column -->
                    <div class="col-md-4">
                        {% if job %}
                        <div class="mb-3">
                            <label class="form-label">Job Number</label>
                            <input type="text" class="form-control" value="{{ job.job_number }}" readonly>
                        </div>
                        {% endif %}

                        <div class="mb-3">
                            <label for="status" class="form-label">Status</label>
                            <select class="form-select" id="status" name="status">
                                <option value="draft" {% if job and job.status == 'draft' %}selected{% endif %}>Draft</option>
                                <option value="planning" {% if job and job.status == 'planning' %}selected{% endif %}>Planning</option>
                                <option value="active" {% if job and job.status == 'active' %}selected{% endif %}>Active</option>
                                <option value="on_hold" {% if job and job.status == 'on_hold' %}selected{% endif %}>On Hold</option>
                                <option value="review" {% if job and job.status == 'review' %}selected{% endif %}>Review</option>
                                <option value="completed" {% if job and job.status == 'completed' %}selected{% endif %}>Completed</option>
                                <option value="cancelled" {% if job and job.status == 'cancelled' %}selected{% endif %}>Cancelled</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="job_type" class="form-label">Job Type</label>
                            <select class="form-select" id="job_type" name="job_type">
                                <option value="client_project" {% if job and job.job_type == 'client_project' %}selected{% endif %}>Client Project</option>
                                <option value="internal_project" {% if job and job.job_type == 'internal_project' %}selected{% endif %}>Internal Project</option>
                                <option value="service" {% if job and job.job_type == 'service' %}selected{% endif %}>Service</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="customer_id" class="form-label">Customer</label>
                            <select class="form-select" id="customer_id" name="customer_id">
                                <option value="">-- Select Customer --</option>
                                {% for customer in customers %}
                                <option value="{{ customer.id }}" {% if job and job.customer_id == customer.id %}selected{% endif %}>
                                    {{ customer.name }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="assigned_to" class="form-label">Assigned To</label>
                            <select class="form-select" id="assigned_to" name="assigned_to">
                                <option value="">-- Unassigned --</option>
                                {% for user in users %}
                                <option value="{{ user.id }}" {% if job and job.assigned_to == user.id %}selected{% endif %}>
                                    {{ user.full_name or user.username }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>

                        {% if session.get('role') == 'super_admin' and not job %}
                        <div class="mb-3">
                            <label for="agency_id" class="form-label">Agency</label>
                            <select class="form-select" id="agency_id" name="agency_id">
                                {% for agency in agencies %}
                                <option value="{{ agency.id }}" {% if job and job.agency_id == agency.id %}selected{% endif %}>
                                    {{ agency.name }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                        {% endif %}
                    </div>
                </div>

                <div class="mt-4">
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save me-1"></i> Save Changes
                    </button>
                    <a href="{{ url_for('job_accounting.list_jobs') }}" class="btn btn-secondary">
                        <i class="fas fa-times me-1"></i> Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    // You can add JS for TomSelect or other enhancements here later
</script>
{% endblock %}
